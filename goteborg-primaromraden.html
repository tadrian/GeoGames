<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Göteborgs primärområden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light dark;

  --ink:#EDF0F1;        /* ground */
  --panel:#F6F8F8;
  --line:#D2DADD;
  --land:#DCE4E6;
  --land-edge:#A9B8BD;
  --water:#EDF0F1;
  --text:#14201F;
  --mute:#5E7178;
  --brass:#A2701A;
  --brass-ink:#FFFFFF;
  --patina:#2F7D73;
  --shadow:0 1px 2px rgba(20,32,31,.08), 0 8px 24px rgba(20,32,31,.10);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#0B1114;
    --panel:#111A1E;
    --line:#22333A;
    --land:#223037;
    --land-edge:#42585F;
    --water:#0B1114;
    --text:#E2EAEC;
    --mute:#8298A0;
    --brass:#D9A441;
    --brass-ink:#12181A;
    --patina:#69B0A3;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --ink:#0B1114; --panel:#111A1E; --line:#22333A; --land:#223037;
  --land-edge:#42585F; --water:#0B1114; --text:#E2EAEC; --mute:#8298A0;
  --brass:#D9A441; --brass-ink:#12181A; --patina:#69B0A3;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.45);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{
  background:var(--ink);color:var(--text);
  font-family:"Inter Tight",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
  overflow:hidden;
}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:336px 1fr;height:100%;min-height:100dvh}
@media (max-width:860px){
  /* Appens vy kan sakna egen höjd. Låt sidan flöda och ge kartan
     en höjd som inte beror på viewporten alls. */
  html,body{height:auto;overflow:visible}
  .app{display:block;height:auto;min-height:0}
  .stage{
    width:100%;height:auto;aspect-ratio:1/1;
    min-height:300px;max-height:56vh
  }
  .panel{max-height:none;border-right:0;border-top:1px solid var(--line)}
  .list{max-height:44vh}
}

/* ---------- map ---------- */
.stage{position:relative;min-width:0;min-height:0;background:var(--water);overflow:hidden}
svg#map{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
svg#map.dragging{cursor:grabbing}
path.o{
  fill:var(--land);stroke:var(--land-edge);stroke-width:.9px;
  vector-effect:non-scaling-stroke;stroke-linejoin:round;
}
path.o.dim{opacity:.22}
path.o.hot{fill:var(--land);fill:color-mix(in oklab,var(--patina) 34%,var(--land));stroke:var(--patina);stroke-width:1.6px}
path.o.sel{fill:var(--brass);stroke:var(--brass);stroke-width:2px;filter:saturate(1.05)}

.pin{
  position:absolute;transform:translate(-50%,-140%);pointer-events:none;
  background:var(--brass);color:var(--brass-ink);
  font-family:"Bricolage Grotesque",sans-serif;
  font-weight:700;font-size:13px;letter-spacing:-.01em;
  padding:3px 9px;border-radius:3px;white-space:nowrap;box-shadow:var(--shadow);
  opacity:0;transition:opacity .15s
}
.pin.on{opacity:1}
.tip{
  position:absolute;pointer-events:none;z-index:5;
  transform:translate(12px,-50%);
  background:var(--panel);color:var(--text);border:1px solid var(--line);
  padding:5px 10px;border-radius:4px;font-size:13px;white-space:nowrap;
  box-shadow:var(--shadow);opacity:0;transition:opacity .12s
}
.tip.on{opacity:1}
.tip b{font-weight:600}
.tip span{color:var(--mute);font-variant-numeric:tabular-nums}

.tools{
  position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px;
}
.tools button{
  width:38px;height:38px;border-radius:4px;border:1px solid var(--line);
  background:var(--panel);color:var(--text);font-size:17px;line-height:1;
  cursor:pointer;box-shadow:var(--shadow);font-family:inherit
}
.tools button:hover{border-color:var(--patina);color:var(--patina)}
.tools button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

.scalebar{
  position:absolute;left:14px;bottom:14px;color:var(--mute);font-size:11px;
  font-variant-numeric:tabular-nums;pointer-events:none
}
.scalebar i{display:block;height:5px;border:1px solid var(--mute);border-top:0;margin-bottom:3px}

/* ---------- panel ---------- */
.panel{
  order:-1;
  display:flex;flex-direction:column;min-height:0;
  background:var(--panel);border-right:1px solid var(--line)
}
.head{padding:18px 18px 12px}
.head h1{
  margin:0;font-family:"Bricolage Grotesque",sans-serif;font-weight:700;
  font-size:26px;line-height:1.05;letter-spacing:-.025em
}
.head p{margin:5px 0 0;color:var(--mute);font-size:13px}

.controls{padding:0 18px 12px;display:flex;flex-direction:column;gap:9px}
input[type=search]{
  width:100%;padding:9px 11px;border-radius:4px;border:1px solid var(--line);
  background:var(--ink);color:var(--text);font:inherit;font-size:14px
}
input[type=search]::placeholder{color:var(--mute)}
input[type=search]:focus{outline:2px solid var(--brass);outline-offset:-1px;border-color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips button{
  border:1px solid var(--line);background:transparent;color:var(--mute);
  font:inherit;font-size:12.5px;padding:4px 10px;border-radius:999px;cursor:pointer
}
.chips button[aria-pressed=true]{background:var(--text);color:var(--panel);border-color:var(--text)}
.chips button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

.tray{
  background:var(--panel);
  flex:none;display:flex;align-items:center;gap:8px;padding:9px 14px;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  background:color-mix(in oklab,var(--ink) 55%,var(--panel))
}
.tray button{
  border:1px solid var(--line);background:var(--ink);color:var(--text);
  border-radius:4px;cursor:pointer;font:inherit;line-height:1;padding:0
}
.tray button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.dice{flex:none;width:46px;height:38px;font-size:18px}
.dice:hover{border-color:var(--brass);background:var(--ink);background:color-mix(in oklab,var(--brass) 18%,var(--ink))}
.dice:active{transform:translateY(1px)}
.lock{flex:none;width:40px;height:38px;font-size:15px;opacity:.68}
.lock:hover{opacity:1;border-color:var(--patina)}
.lock[aria-pressed=true]{opacity:1;background:var(--brass);border-color:var(--brass);color:var(--brass-ink)}
.trayhint{
  flex:1 1 auto;min-width:0;text-align:center;color:var(--mute);font-size:12px;
  font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
@media (max-width:430px){.trayhint{display:none}}

.list{flex:1 1 auto;overflow-y:auto;padding:0 8px 8px;min-height:0;overscroll-behavior:contain}
.list button{
  display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:baseline;
  width:100%;text-align:left;border:0;background:transparent;color:var(--text);
  font:inherit;padding:7px 10px;border-radius:4px;cursor:pointer
}
.list button:hover{background:var(--ink);background:color-mix(in oklab,var(--patina) 14%,transparent)}
.list button[aria-current=true]{background:var(--brass);color:var(--brass-ink)}
.list button[aria-current=true] .nr,.list button[aria-current=true] .km{color:var(--brass-ink);opacity:.85}
.list button:focus-visible{outline:2px solid var(--brass);outline-offset:-2px}
.nr,.km{color:var(--mute);font-variant-numeric:tabular-nums;font-size:13px}
.km{font-size:12.5px}
.empty{padding:14px 18px;color:var(--mute);font-size:13.5px}

.detail{border-top:1px solid var(--line);padding:14px 18px 18px;background:var(--panel)}
.detail .nm{
  font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:30px;
  line-height:1.02;letter-spacing:-.03em;margin:0 0 8px;overflow-wrap:anywhere
}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin:0}
.facts div{min-width:0}
.facts dt{color:var(--mute);font-size:11.5px;margin:0}
.facts dd{margin:1px 0 0;font-size:14.5px;font-variant-numeric:tabular-nums}
.hint{color:var(--mute);font-size:12.5px;margin:2px 0 0}

.foot{padding:10px 18px 14px;border-top:1px solid var(--line);color:var(--mute);font-size:11.5px}
.foot a{color:var(--mute)}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<div class="app">

  <div class="stage" id="stage">
    <svg id="map" viewBox="-17599 -17270 34757 36298" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Karta över Göteborgs 96 primärområden"></svg>
    <div class="pin" id="pin"></div>
    <div class="tip" id="tip"></div>
    <div class="tools">
      <button id="zin" title="Zooma in" aria-label="Zooma in">+</button>
      <button id="zout" title="Zooma ut" aria-label="Zooma ut">−</button>
      <button id="fit" title="Visa hela kommunen inklusive skärgården" aria-label="Visa hela kommunen">⤢</button>

  <aside class="panel">

      <p id="count">96 områden</p>

      <div class="chips" id="chips" role="group" aria-label="Filtrera på stadsområde"></div>
    </div>

    <div class="tray" role="group" aria-label="Slumpa fram ett område">
      <button id="rndL" class="dice" title="Slumpa ett område" aria-label="Slumpa ett område">&#127922;</button>
      <span class="trayhint" id="trayhint"></span>
      <button id="lock" class="lock" aria-pressed="false"
        title="L&#229;s vyn &#8212; beh&#229;ll nuvarande utsnitt" aria-label="L&#229;s vyn">&#128275;</button>
      <button id="rndR" class="dice" title="Slumpa ett område" aria-label="Slumpa ett område">&#127922;</button>
    </div>

    <div class="list" id="list" role="list"></div>

    <div class="detail" id="detail" hidden>
      <p class="nm" id="dNamn"></p>
      <dl class="facts">
        <div><dt>Primärområde</dt><dd id="dNr"></dd></div>
        <div><dt>Stadsområde</dt><dd id="dSo"></dd></div>
        <div><dt>Yta</dt><dd id="dYta"></dd></div>
        <div><dt>Andel av kommunen</dt><dd id="dAndel"></dd></div>
      </dl>
    </div>

    <div class="foot">
      Gränser: Göteborgs Stad, öppna data. Stadsområde härlett ur områdesnumret.
    </div>
  </aside>

</div>

const OMR = DATA.omr;
const SO = ["Centrum","Hisingen","Nordost","Sydväst"];
const TOTAL = OMR.reduce((s,o)=>s+o.a,0);

const svg = document.getElementById('map');
const stage = document.getElementById('stage');
const tip = document.getElementById('tip');
const pin = document.getElementById('pin');
const listEl = document.getElementById('list');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

const nf = n => n.toLocaleString('sv-SE',{minimumFractionDigits:2,maximumFractionDigits:2});

/* ---------- draw ---------- */
const NS='http://www.w3.org/2000/svg';
const byNr = {};
const frag = document.createDocumentFragment();
OMR.forEach(o=>{
  const p = document.createElementNS(NS,'path');
  p.setAttribute('d',o.d);
  p.setAttribute('class','o');
  p.dataset.nr = o.nr;
  frag.appendChild(p);
  byNr[o.nr] = {o, path:p};
});
svg.appendChild(frag);

/* ---------- view ---------- */
let view = {x:0,y:0,w:1,h:1};
let anim = null;

function boxOf(b,padFrac){
  const pw=(b[2]-b[0]), ph=(b[3]-b[1]);
  const pad=Math.max(pw,ph)*(padFrac??0.05);
  return [b[0]-pad,b[1]-pad,pw+pad*2,ph+pad*2];
}
let homeBox=null, pendingBox=null;
function fitBox(box,animate){
  homeBox=box;
  const r = stage.getBoundingClientRect();
  if(!(r.width>0) || !(r.height>0)){ pendingBox=box; return; }   // ytan inte layoutad än
  pendingBox=null;
  const ar = r.width/r.height;
  let [x,y,w,h]=box;
  if(w/h > ar){ const nh=w/ar; y-=(nh-h)/2; h=nh; }
  else        { const nw=h*ar; x-=(nw-w)/2; w=nw; }
  setView({x,y,w,h},animate);
}
function setView(v,animate){
  if(anim){cancelAnimationFrame(anim);anim=null;}
  if(!animate || reduce){ view=v; apply(); return; }
  const from={...view}, t0=performance.now(), dur=480;
  const step=now=>{
    const t=Math.min(1,(now-t0)/dur);
    const e=t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
    view={x:from.x+(v.x-from.x)*e, y:from.y+(v.y-from.y)*e,
          w:from.w+(v.w-from.w)*e, h:from.h+(v.h-from.h)*e};
    apply();
    if(t<1) anim=requestAnimationFrame(step); else anim=null;
  };
  anim=requestAnimationFrame(step);
}
function apply(){
  svg.setAttribute('viewBox',`${view.x} ${view.y} ${view.w} ${view.h}`);
  placePin(); scalebar();
}
function scalebar(){
  const r=stage.getBoundingClientRect();
  const mPerPx = view.w / r.width;
  const targetM = mPerPx*90;
  const nice=[100,200,500,1000,2000,5000,10000,20000];
  const m = nice.reduce((a,b)=>Math.abs(b-targetM)<Math.abs(a-targetM)?b:a);
  document.getElementById('sbBar').style.width = (m/mPerPx).toFixed(0)+'px';
  document.getElementById('sbTxt').textContent = m>=1000 ? (m/1000)+' km' : m+' m';
}

/* metres -> screen px */
function toScreen(mx,my){
  const r=stage.getBoundingClientRect();
  return [ (mx-view.x)/view.w*r.width, (my-view.y)/view.h*r.height ];
}

/* ---------- selection ---------- */
let sel=null, hot=null, filter='alla', query='', locked=false;

function placePin(){
  if(!sel){pin.classList.remove('on');return;}
  const [sx,sy]=toScreen(sel.o.c[0],sel.o.c[1]);
  const r=stage.getBoundingClientRect();
  if(sx<-60||sy<-60||sx>r.width+60||sy>r.height+60){pin.classList.remove('on');return;}
  pin.style.left=sx+'px'; pin.style.top=sy+'px';
  pin.classList.add('on');
}

function select(nr,{zoom=true,fromList=false}={}){
  if(sel){sel.path.classList.remove('sel');}
  if(!nr || (sel && sel.o.nr===nr && !fromList)){
    sel=null; document.getElementById('detail').hidden=true;
    pin.classList.remove('on'); markList(); return;
  }
  sel=byNr[nr];
  sel.path.classList.add('sel');
  svg.appendChild(sel.path);                 // bring to front
  pin.textContent = sel.o.namn;
  const o=sel.o;
  document.getElementById('detail').hidden=false;
  document.getElementById('dNamn').textContent=o.namn;
  document.getElementById('dNr').textContent=o.nr;
  document.getElementById('dSo').textContent=o.so;
  document.getElementById('dYta').textContent=nf(o.a)+' km²';
  document.getElementById('dAndel').textContent=nf(o.a/TOTAL*100)+' %';
  if(zoom && !locked) fitBox(boxOf(o.b,0.35),true);
  markList();
}

/* ---------- list ---------- */
function visible(){
  const q=query.trim().toLowerCase();
  return OMR.filter(o=>{
    if(filter!=='alla' && o.so!==filter) return false;
    if(!q) return true;
    return o.namn.toLowerCase().includes(q) || o.nr.includes(q);
  });
}
function renderList(){
  const v=visible();
  listEl.innerHTML='';
  document.getElementById('trayhint').textContent =
    v.length ? 'Slumpar bland ' + v.length : 'Inget att slumpa bland';
  document.getElementById('count').textContent =
    v.length===OMR.length ? OMR.length+' områden'
                          : v.length+' av '+OMR.length+' områden';
  if(!v.length){
    const d=document.createElement('p'); d.className='empty';
    d.textContent='Inget område matchar sökningen.';
    listEl.appendChild(d);
  }
  const f=document.createDocumentFragment();
  v.forEach(o=>{
    const b=document.createElement('button');
    b.type='button'; b.dataset.nr=o.nr; b.setAttribute('role','listitem');
    b.innerHTML=`<span class="nr">${o.nr}</span><span>${o.namn}</span><span class="km">${nf(o.a)} km²</span>`;
    b.addEventListener('click',()=>select(o.nr,{fromList:true}));
    b.addEventListener('mouseenter',()=>setHot(o.nr));
    b.addEventListener('mouseleave',()=>setHot(null));
    f.appendChild(b);
  });
  listEl.appendChild(f);
  // dim non-matching on the map when filtering
  const set=new Set(v.map(o=>o.nr));
  const dimming = v.length!==OMR.length;
  OMR.forEach(o=>byNr[o.nr].path.classList.toggle('dim', dimming && !set.has(o.nr)));
  markList();
}
function markList(){
  listEl.querySelectorAll('button').forEach(b=>
    b.setAttribute('aria-current', sel && b.dataset.nr===sel.o.nr ? 'true':'false'));
}
function setHot(nr){
  if(hot) hot.path.classList.remove('hot');
  hot = nr ? byNr[nr] : null;
  if(hot){ hot.path.classList.add('hot'); if(!sel||sel!==hot) svg.appendChild(hot.path); }
  if(sel) svg.appendChild(sel.path);
}

/* chips */
const chips=document.getElementById('chips');
['alla',...SO].forEach(k=>{
  const b=document.createElement('button');
  b.type='button'; b.textContent = k==='alla' ? 'Alla' : k;
  b.setAttribute('aria-pressed', k==='alla');
  b.addEventListener('click',()=>{
    filter=k;
    chips.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed', x===b));
    renderList();
    const v=visible();
    if(v.length && !locked){
      const bb=v.reduce((a,o)=>[Math.min(a[0],o.b[0]),Math.min(a[1],o.b[1]),
                               Math.max(a[2],o.b[2]),Math.max(a[3],o.b[3])],
                        [1e9,1e9,-1e9,-1e9]);
      fitBox(boxOf(bb,0.06),true);
    }
  });
  chips.appendChild(b);
});
document.getElementById('q').addEventListener('input',e=>{query=e.target.value;renderList();});

/* ---------- map interaction ---------- */
svg.addEventListener('pointermove',e=>{
  const el=document.elementFromPoint(e.clientX,e.clientY);
  const nr = el && el.dataset ? el.dataset.nr : null;
  if(nr && !dragging){
    if(!hot || hot.o.nr!==nr) setHot(nr);
    const r=stage.getBoundingClientRect();
    const o=byNr[nr].o;
    tip.innerHTML=`<b>${o.namn}</b> <span>${o.nr}</span>`;
    let x=e.clientX-r.left, y=e.clientY-r.top;
    tip.style.left=x+'px'; tip.style.top=y+'px';
    tip.style.transform = x > r.width-170 ? 'translate(calc(-100% - 12px),-50%)' : 'translate(12px,-50%)';
    tip.classList.add('on');
  }else{
    if(hot) setHot(null);
    tip.classList.remove('on');
  }
});
svg.addEventListener('pointerleave',()=>{setHot(null);tip.classList.remove('on');});

let dragging=false, moved=0, last=null, pointers=new Map(), pinchDist=0;
svg.addEventListener('pointerdown',e=>{
  svg.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId,[e.clientX,e.clientY]);
  if(pointers.size===1){dragging=true;moved=0;last=[e.clientX,e.clientY];svg.classList.add('dragging');}
  if(pointers.size===2){
    const p=[...pointers.values()];
    pinchDist=Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]);
  }
});
svg.addEventListener('pointermove',e=>{
  if(!pointers.has(e.pointerId))return;
  pointers.set(e.pointerId,[e.clientX,e.clientY]);
  const r=stage.getBoundingClientRect();
  if(pointers.size===2){
    const p=[...pointers.values()];
    const d=Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]);
    if(pinchDist>0){
      const cx=(p[0][0]+p[1][0])/2-r.left, cy=(p[0][1]+p[1][1])/2-r.top;
      zoomAt(cx,cy,pinchDist/d);
    }
    pinchDist=d; moved=99; return;
  }
  if(dragging && last){
    const dx=e.clientX-last[0], dy=e.clientY-last[1];
    moved+=Math.abs(dx)+Math.abs(dy);
    view.x-=dx*view.w/r.width; view.y-=dy*view.h/r.height;
    last=[e.clientX,e.clientY]; apply();
  }
});
function endPtr(e){
  pointers.delete(e.pointerId);
  if(pointers.size<2)pinchDist=0;
  if(pointers.size===0){
    dragging=false; last=null; svg.classList.remove('dragging');
    if(moved<5){
      const el=document.elementFromPoint(e.clientX,e.clientY);
      select(el && el.dataset ? el.dataset.nr : null);
    }
  }
}
svg.addEventListener('pointerup',endPtr);
svg.addEventListener('pointercancel',endPtr);

function zoomAt(px,py,k){
  const r=stage.getBoundingClientRect();
  const mx=view.x+px/r.width*view.w, my=view.y+py/r.height*view.h;
  let w=view.w*k, h=view.h*k;
  const maxW=(DATA.extent[2]-DATA.extent[0])*2.2, minW=250;
  w=Math.min(maxW,Math.max(minW,w)); h=w*(view.h/view.w);
  view={x:mx-(mx-view.x)*(w/view.w), y:my-(my-view.y)*(h/view.h), w, h};
  apply();
}
svg.addEventListener('wheel',e=>{
  e.preventDefault();
  const r=stage.getBoundingClientRect();
  zoomAt(e.clientX-r.left,e.clientY-r.top, Math.exp(e.deltaY*0.0016));
},{passive:false});

document.getElementById('zin').onclick=()=>{const r=stage.getBoundingClientRect();zoomAt(r.width/2,r.height/2,1/1.5);};
document.getElementById('zout').onclick=()=>{const r=stage.getBoundingClientRect();zoomAt(r.width/2,r.height/2,1.5);};
document.getElementById('fit').onclick=()=>{
  const whole = document.getElementById('fit').dataset.whole==='1';
  fitBox(boxOf(whole?DATA.mainland:DATA.extent,0.03),true);
  document.getElementById('fit').dataset.whole = whole?'0':'1';
  document.getElementById('fit').title = whole ? 'Visa hela kommunen inklusive skärgården' : 'Visa fastlandet';
};
document.getElementById('fit').dataset.whole='0';

function roll(){
  const pool = visible();
  if(!pool.length) return;
  const pick = pool.filter(o=>!sel || o.nr!==sel.o.nr);
  const src = pick.length ? pick : pool;
  const o = src[Math.floor(Math.random()*src.length)];
  select(o.nr,{fromList:true});
  const b = listEl.querySelector('button[data-nr="'+o.nr+'"]');
  if(b) b.scrollIntoView({block:'nearest', behavior: reduce?'auto':'smooth'});
}
document.getElementById('rndL').onclick=roll;
document.getElementById('rndR').onclick=roll;

const lockBtn=document.getElementById('lock');
lockBtn.onclick=()=>{
  locked=!locked;
  lockBtn.textContent = locked ? '\u{1F512}' : '\u{1F513}';
  lockBtn.setAttribute('aria-pressed', locked?'true':'false');
  lockBtn.title = locked
    ? 'Vyn är låst — kartan flyttar sig inte när du väljer område'
    : 'Lås vyn — behåll nuvarande utsnitt';
};

addEventListener('keydown',e=>{
  if(e.key==='Escape'){select(null);document.getElementById('q').blur();}
});
function remeasure(){
  const r=stage.getBoundingClientRect();
  if(!(r.width>0)||!(r.height>0)) return;
  if(pendingBox){ fitBox(pendingBox,false); return; }
  const ok=[view.x,view.y,view.w,view.h].every(n=>Number.isFinite(n)) && view.w>0;
  fitBox(ok?[view.x,view.y,view.w,view.h]:homeBox||boxOf(DATA.mainland,0.03), false);
}
addEventListener('resize',remeasure);
addEventListener('orientationchange',remeasure);
if(window.ResizeObserver) new ResizeObserver(remeasure).observe(stage);
addEventListener('load',remeasure);
// Skyddsnät: om ytan fortfarande saknar höjd efter layout, sätt en.
function ensureHeight(){
  const r=stage.getBoundingClientRect();
  if(r.width>0 && r.height<60){
    stage.style.height = Math.round(Math.min(420,Math.max(300,r.width))) + 'px';
    remeasure();
  }
}
addEventListener('load',ensureHeight);
setTimeout(ensureHeight,0); setTimeout(ensureHeight,400);

/* ---------- go ---------- */
renderList();
fitBox(boxOf(DATA.mainland,0.03),false);
</script>
</body>
</html>
