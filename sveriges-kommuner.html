<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sveriges kommuner — GeoGames</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --sea:#d8e7ed;
  --land:#f5f0e5; --land-hi:#fffaf0; --land-dim:#c8d2d5; --border:#8fa6af;
  --panel:#f3efe4; --panel-2:#e8e2d3; --rule:#d2cab7;
  --tx:#14323f; --tx-dim:#5d7a86;
  --gold:#b8791b; --gold-soft:#eab84f; --focus:#0f6f92;
  --norr:#4f8191; --syd:#b66d58; --ost:#6f7fa9; --vast:#6e927e;
  --sans:'Archivo','Helvetica Neue',Helvetica,Arial,sans-serif;
  --serif:'Newsreader',Georgia,'Times New Roman',serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --sea:#072434;
    --land:#dfd7c3; --land-hi:#f3ecd8; --land-dim:#4e646e; --border:#4a6571;
    --panel:#0a2c3c; --panel-2:#113c4e; --rule:#1b4759;
    --tx:#e9f1f4; --tx-dim:#8aa4af;
    --gold:#f0ad35; --gold-soft:#e0a23a;
    --norr:#78b4c5; --syd:#d8917c; --ost:#aab8e3; --vast:#9dc8ae;
  }
}
:root[data-theme="dark"]{
  --sea:#072434; --land:#dfd7c3; --land-hi:#f3ecd8; --land-dim:#4e646e; --border:#4a6571;
  --panel:#0a2c3c; --panel-2:#113c4e; --rule:#1b4759;
  --tx:#e9f1f4; --tx-dim:#8aa4af; --gold:#f0ad35; --gold-soft:#e0a23a;
  --norr:#78b4c5; --syd:#d8917c; --ost:#aab8e3; --vast:#9dc8ae;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--sea);color:var(--tx);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:row-reverse}
.stage{position:relative;flex:1;min-width:0;min-height:0;background:var(--sea);touch-action:none;overflow:hidden}
#map{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
#map.drag{cursor:grabbing}
#sweden path{vector-effect:non-scaling-stroke}
.municipality{fill:var(--land);stroke:var(--border);stroke-width:.65;cursor:pointer;transition:fill .12s,opacity .12s}
.municipality.norr{fill:color-mix(in srgb,var(--norr) 48%,var(--land))}
.municipality.syd{fill:color-mix(in srgb,var(--syd) 44%,var(--land))}
.municipality.ost{fill:color-mix(in srgb,var(--ost) 44%,var(--land))}
.municipality.vast{fill:color-mix(in srgb,var(--vast) 44%,var(--land))}
@media (hover:hover){.municipality:hover{fill:var(--land-hi);stroke:var(--tx);stroke-width:1}}
.municipality.coastal{stroke:var(--gold);stroke-width:1.15}
.municipality.border{stroke-dasharray:3 1.8}
.municipality.dim{opacity:.18}
.municipality.hot{fill:var(--land-hi);stroke:var(--tx);stroke-width:1.6;opacity:1}
.municipality.sel{fill:var(--gold-soft);stroke:var(--gold);stroke-width:1.8;opacity:1}
.hud{position:absolute;left:0;right:0;top:0;display:flex;gap:8px;align-items:flex-start;padding:10px 12px;pointer-events:none}
.brand{font-family:var(--serif);font-size:18px;letter-spacing:.01em;background:var(--panel);border:1px solid var(--rule);border-radius:2px;padding:3px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--tx);text-decoration:none;pointer-events:auto;transition:border-color .12s,color .12s}
.brand:hover{border-color:var(--gold);color:var(--gold)}
.readout{margin-left:auto;font-size:13px;font-weight:500;background:var(--panel);border:1px solid var(--rule);border-radius:2px;padding:4px 10px;opacity:0;transition:opacity .12s;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.readout.on{opacity:1}
.zoomer{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;border:1px solid var(--rule);border-radius:2px;overflow:hidden;background:var(--panel)}
.zoomer button{width:40px;height:40px;font-size:18px;line-height:1;display:grid;place-items:center}
.zoomer button+button{border-top:1px solid var(--rule)}
.zoomer button:active{background:var(--panel-2)}
.scalebar{position:absolute;left:12px;bottom:14px;font-size:11px;color:var(--tx-dim);pointer-events:none;letter-spacing:.02em}
.legend{position:absolute;left:12px;top:58px;display:flex;gap:5px;flex-wrap:wrap;max-width:min(520px,calc(100% - 24px));pointer-events:none}
.legend span{display:inline-flex;align-items:center;gap:5px;padding:3px 7px;background:var(--panel);border:1px solid var(--rule);border-radius:2px;font-size:11px;color:var(--tx-dim)}
.legend i{display:block;width:8px;height:8px;border-radius:50%}
.legend .norr{background:var(--norr)}.legend .syd{background:var(--syd)}.legend .ost{background:var(--ost)}.legend .vast{background:var(--vast)}.legend .coast{background:var(--gold)}
.panel{width:380px;flex:none;background:var(--panel);border-left:1px solid var(--rule);display:flex;flex-direction:column;min-height:0;position:relative}
.panel-head{padding:17px 16px 11px;flex:none}
.menu-link{display:inline-flex;align-items:center;gap:5px;margin-bottom:11px;color:var(--tx-dim);font-size:13px;font-weight:600;text-decoration:none}
.menu-link:hover{color:var(--gold)}
.panel-head h1{font-family:var(--serif);font-size:29px;line-height:1.05;font-weight:400;margin:0}
.panel-head p{margin:4px 0 0;color:var(--tx-dim);font-size:12px}
.controls{padding:0 14px 9px;flex:none}
.search{display:flex;gap:8px;margin-bottom:8px}
.search input{width:100%;min-width:0;background:var(--panel-2);border:1px solid var(--rule);border-radius:2px;padding:9px 10px;font:inherit;color:inherit}
.search input::placeholder{color:var(--tx-dim)}
.search input:focus{outline:2px solid var(--focus);outline-offset:-1px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips button{border:1px solid var(--rule);border-radius:2px;padding:4px 8px;color:var(--tx-dim);font-size:12px}
.chips button[aria-pressed=true]{background:var(--tx);border-color:var(--tx);color:var(--panel)}
.chips button:disabled{opacity:.5;cursor:wait}
.tray{flex:none;display:flex;align-items:center;gap:8px;padding:8px 14px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);background:var(--panel-2)}
.rndbtn{flex:none;width:40px;height:37px;border:1px solid var(--gold);border-radius:2px;font-size:18px;line-height:1;display:grid;place-items:center}
.rndbtn:hover{background:var(--gold)}
.rndbtn:active{transform:translateY(1px)}
.lockbtn{flex:none;width:40px;height:37px;border:1px solid var(--rule);border-radius:2px;font-size:16px;line-height:1;display:grid;place-items:center;opacity:.65}
.lockbtn.on{border-color:var(--gold);background:var(--gold);opacity:1}
.trayhint{flex:1;min-width:0;text-align:center;color:var(--tx-dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbody{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.list{list-style:none;margin:0;padding:0 0 17px}
.list li button{display:grid;grid-template-columns:42px 1fr auto;gap:8px;align-items:baseline;text-align:left;width:100%;padding:8px 14px;border-bottom:1px solid var(--rule)}
.list li button:hover{background:var(--panel-2)}
.list li button[aria-current=true]{background:var(--gold-soft);color:#14201f}
.code,.tag{font-size:12px;color:var(--tx-dim);font-variant-numeric:tabular-nums}
.list li button[aria-current=true] .code,.list li button[aria-current=true] .tag{color:#14201f}
.nm{font-weight:500}
.tag{border:1px solid currentColor;border-radius:2px;padding:1px 4px;white-space:nowrap}
.empty,.loading,.error{padding:22px 14px;color:var(--tx-dim)}
.error{color:#a64d43}
.detail{padding:0 14px 26px}
.back{font-size:13px;font-weight:500;color:var(--tx-dim);padding:2px 0 12px}
.dhead{display:flex;gap:12px;align-items:flex-start}
.dname{font-family:var(--serif);font-size:30px;line-height:1.1;font-weight:400;margin:0}
.dsub{font-family:var(--serif);font-style:italic;font-weight:300;color:var(--tx-dim);font-size:15px;margin:2px 0 0}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin:15px 0 4px}
.badges span{border:1px solid var(--rule);border-radius:2px;padding:3px 7px;font-size:12px;color:var(--tx-dim)}
.badges .region{color:var(--tx);border-color:var(--gold)}
.facts{margin:16px 0 0;display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:14px}
.facts dt{color:var(--tx-dim)}
.facts dd{margin:0}
.note{margin-top:19px;padding-top:12px;border-top:1px solid var(--rule);font-size:12px;color:var(--tx-dim);line-height:1.5}
.source{padding:10px 14px 13px;border-top:1px solid var(--rule);color:var(--tx-dim);font-size:11px;flex:none}
.source a{color:inherit}
@media (max-width:899px){
  html,body{height:auto;overflow:visible}
  .app{display:block;height:auto;min-height:0}
  .stage{width:100%;height:auto;aspect-ratio:1/1.05;min-height:360px;max-height:64vh}
  .panel{width:100%;height:46vh;min-height:300px;border-left:0;border-top:1px solid var(--rule)}
  .brand{font-size:17px}
}
@media (max-width:520px){.legend{top:55px}.legend span{font-size:10px;padding:2px 5px}.trayhint{font-size:11px}.panel-head h1{font-size:27px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <main class="stage" id="stage">
    <svg id="map" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Karta över Sveriges kommuner"></svg>
    <div class="hud">
      <a class="brand" href="index.html" aria-label="Tillbaka till spelmenyn">← Spelmeny · Sverige</a>
      <div class="readout" id="readout"></div>
    </div>
    <div class="legend" aria-hidden="true">
      <span><i class="norr"></i>Norr</span><span><i class="syd"></i>Syd</span><span><i class="ost"></i>Öst</span><span><i class="vast"></i>Väst</span><span><i class="coast"></i>Kust / landgräns</span>
    </div>
    <div class="scalebar" id="scalebar">Sverige</div>
    <div class="zoomer">
      <button id="zin" title="Zooma in" aria-label="Zooma in">+</button>
      <button id="zout" title="Zooma ut" aria-label="Zooma ut">−</button>
      <button id="zres" title="Visa hela Sverige" aria-label="Visa hela Sverige">⤾</button>
    </div>
  </main>

  <aside class="panel">
    <div class="panel-head">
      <a class="menu-link" href="index.html" aria-label="Tillbaka till spelmenyn">← Till spelmenyn</a>
      <h1>Sveriges kommuner</h1>
      <p id="count">Laddar kommuner…</p>
    </div>
    <div class="controls">
      <div class="search"><input id="q" type="search" placeholder="Sök kommun eller kommunkod" autocomplete="off" spellcheck="false" aria-label="Sök kommun" disabled></div>
      <div class="chips" id="chips" role="group" aria-label="Filtrera kommuner"></div>
    </div>
    <div class="tray" role="group" aria-label="Slumpa fram en kommun">
      <button id="rndL" class="rndbtn" title="Slumpa en kommun" aria-label="Slumpa en kommun" disabled>🎲</button>
      <span class="trayhint" id="trayhint">Laddar kartan…</span>
      <button id="lock" class="lockbtn" aria-pressed="false" title="Lås vyn" aria-label="Lås vyn" disabled>🔓</button>
      <button id="rndR" class="rndbtn" title="Slumpa en kommun" aria-label="Slumpa en kommun" disabled>🎲</button>
    </div>
    <div class="pbody" id="pbody"><p class="loading">Laddar Sveriges 290 kommuner…</p></div>
    <div class="source">Gränser: <a href="https://github.com/okfse/sweden-geojson" target="_blank" rel="noreferrer">okfse/sweden-geojson</a>, ursprungligen Valmyndighetens data. Kust/landgräns är en pedagogisk spelkategori.</div>
  </aside>
</div>

<script>
(function(){
  "use strict";
  var DATA_URL = "https://raw.githubusercontent.com/okfse/sweden-geojson/master/swedish_municipalities.geojson";
  var svg = document.getElementById("map"), stage = document.getElementById("stage");
  var pbody = document.getElementById("pbody"), queryInput = document.getElementById("q");
  var countEl = document.getElementById("count"), trayhint = document.getElementById("trayhint");
  var readout = document.getElementById("readout"), reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  var municipalities = [], byCode = {}, selected = null, selectedEl = null, hot = null;
  var filter = "alla", query = "", locked = false, dragging = false, moved = 0, last = null;
  var pointers = new Map(), pinchDistance = 0, animation = null;
  var view = {x:0,y:0,w:1,h:1}, homeBox = null;

  var REGION_ORDER = ["Norr", "Syd", "Öst", "Väst"];
  var LAND_BORDER = new Set([
    "arjeplog","berg","dals-ed","eda","harjedalen","kiruna","krokom","malung-salen","sorsele","storuman","stromstad","stromsund","torsby","are","arjang","alvdalen",
    "haparanda","kiruna","pajala","overtornea"
  ]);
  var COASTAL = new Set([
    "alvkarleby","angelholm","bastad","borgholm","bromolla","burlov","danderyd","falkenberg","gavle","gotland","goteborg","haninge","harnosand","helsingborg","hudiksvall","hoganas","haparanda","kalix","kalmar","karlhamn","karlskrona","kramfors","kungsbacka","kungalv","kavlinge","laholm","lands krona","landskrona","lidingo","lomma","lysekil","malmo","monsteras","munkedal","nacka","nordanstig","norrkoping","norrtalje","nordmaling","nynashamn","nykoping","ockero","orust","oskarshamn","oxelosund","pitea","robertsfors","ronneby","simrishamn","skurup","skelleftea","skurup","sodertalje","soderhamn","soderkoping","solvesborg","sotenäs","sotenas","stenungsund","stockholm","stromstad","sundsvall","tanum","timra","tjorn","trelleborg","trosa","torsas","uddevalla","umea","valdemarsvik","varberg","vellinge","vaxholm","varmdo","vasterik","vastervik","ystad","osteraker","osthammar","tierp","morfylanga","morbylanga","munkedal","mörbylånga","öckerö","örnsköldsvik","ornskoldsvik","lulea","luleå"
  ]);
  var COUNTY_NAMES = {"01":"Stockholms län","03":"Uppsala län","04":"Södermanlands län","05":"Östergötlands län","06":"Jönköpings län","07":"Kronobergs län","08":"Kalmar län","09":"Gotlands län","10":"Blekinge län","12":"Skåne län","13":"Hallands län","14":"Västra Götalands län","17":"Värmlands län","18":"Örebro län","19":"Västmanlands län","20":"Dalarnas län","21":"Gävleborgs län","22":"Västernorrlands län","23":"Jämtlands län","24":"Västerbottens län","25":"Norrbottens län"};

  function norm(s){
    return String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/å/g,"a").replace(/ä/g,"a").replace(/ö/g,"o").replace(/\s+/g," ").trim();
  }
  function esc(s){return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
  function project(pair){return [(pair[0] - 10) * 0.55, 70 - pair[1]];}
  function regionFor(center){
    var lat = center[0], lon = center[1];
    if (lat >= 61.8) return "Norr";
    if (lat < 57.5) return "Syd";
    return lon >= 15.3 ? "Öst" : "Väst";
  }
  function geoPath(geometry){
    var polygons = geometry.type === "Polygon" ? [geometry.coordinates] : geometry.coordinates;
    var parts = [], points = [];
    polygons.forEach(function(polygon){
      polygon.forEach(function(ring){
        var projected = ring.map(function(pair){var p=project(pair);points.push(p);return p;});
        if (!projected.length) return;
        parts.push("M" + projected.map(function(p){return p[0].toFixed(4) + "," + p[1].toFixed(4);}).join("L") + "Z");
      });
    });
    var xs=points.map(function(p){return p[0];}), ys=points.map(function(p){return p[1];});
    var box=[Math.min.apply(null,xs),Math.min.apply(null,ys),Math.max.apply(null,xs),Math.max.apply(null,ys)];
    return {d:parts.join(""),b:[box[0],box[1],Math.max(.001,box[2]-box[0]),Math.max(.001,box[3]-box[1])]};
  }
  function makeMunicipality(feature){
    var p=feature.properties, center=p.geo_point_2d, name=p.kom_namn, key=norm(name), shape=geoPath(feature.geometry);
    var coastal=COASTAL.has(key), border=LAND_BORDER.has(key);
    return {code:String(p.id),name:name,lanCode:String(p.lan_code),lan:COUNTY_NAMES[String(p.lan_code)] || "Sverige",center:center,d:shape.d,b:shape.b,region:regionFor(center),coastal:coastal,border:border,key:key};
  }
  function borderLabel(m){
    if (m.coastal && m.border) return "Kust + riksgräns";
    if (m.coastal) return "Kustkommun";
    if (m.border) return "Landgräns Norge/Finland";
    return "Inlandskommun";
  }
  function regionClass(r){return r.toLowerCase().replace("ö","o");}
  function visible(){
    var q=norm(query);
    return municipalities.filter(function(m){
      if(filter!=="alla" && filter!=="kust" && m.region!==filter) return false;
      if(filter==="kust" && !m.coastal && !m.border) return false;
      if(!q) return true;
      return norm(m.name).indexOf(q)>-1 || m.code.indexOf(q)>-1 || norm(m.lan).indexOf(q)>-1;
    });
  }
  function setView(v,animate){
    if(animation){cancelAnimationFrame(animation);animation=null;}
    if(!animate || reduce){view=v;apply();return;}
    var from=Object.assign({},view), t0=performance.now(), duration=420;
    function step(now){var t=Math.min(1,(now-t0)/duration),e=t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
      view={x:from.x+(v.x-from.x)*e,y:from.y+(v.y-from.y)*e,w:from.w+(v.w-from.w)*e,h:from.h+(v.h-from.h)*e};apply();
      if(t<1) animation=requestAnimationFrame(step); else animation=null;
    }
    animation=requestAnimationFrame(step);
  }
  function fitBox(box,animate){
    homeBox=box;var r=stage.getBoundingClientRect();if(!(r.width>0&&r.height>0))return;
    var ar=r.width/r.height,x=box[0],y=box[1],w=box[2],h=box[3];
    if(w/h>ar){var nh=w/ar;y-=(nh-h)/2;h=nh;}else{var nw=h*ar;x-=(nw-w)/2;w=nw;}
    setView({x:x,y:y,w:w,h:h},animate);
  }
  function apply(){svg.setAttribute("viewBox",view.x+" "+view.y+" "+view.w+" "+view.h);}
  function zoomAt(px,py,factor){
    var r=stage.getBoundingClientRect(),mx=view.x+px/r.width*view.w,my=view.y+py/r.height*view.h;
    var w=Math.max(.35,Math.min(28,view.w*factor)),h=w*(view.h/view.w);
    view={x:mx-(mx-view.x)*(w/view.w),y:my-(my-view.y)*(h/view.h),w:w,h:h};apply();
  }
  function markList(){pbody.querySelectorAll(".list button").forEach(function(b){b.setAttribute("aria-current",selected&&b.dataset.code===selected.code?"true":"false");});}
  function setHot(code){if(hot)hot.el.classList.remove("hot");hot=code?byCode[code]:null;if(hot){hot.el.classList.add("hot");}if(selected)selected.el.classList.add("sel");}
  function select(code,doZoom){
    if(selected){selected.el.classList.remove("sel");}
    selected=null;
    if(!code){showList();return;}
    var m=byCode[code];if(!m)return;
    selected=m;m.el.classList.add("sel");svg.appendChild(m.el);
    if(doZoom&&!locked)fitBox([m.b[0],m.b[1],m.b[2],m.b[3]],true);
    showDetail(m);markList();
  }
  function renderList(){
    var rows=visible();
    trayhint.textContent=rows.length?"Slumpar bland "+rows.length:"Inget att slumpa bland";
    countEl.textContent=(filter==="alla"&&!query?"290 kommuner":""+rows.length+" av 290 kommuner")+(filter==="kust"?" · kust/landgräns":"");
    if(!rows.length){pbody.innerHTML='<p class="empty">Inga kommuner matchar sökningen.</p>';return;}
    var html='<ul class="list">'+rows.map(function(m){return '<li><button type="button" data-code="'+esc(m.code)+'"><span class="code">'+esc(m.code)+'</span><span class="nm">'+esc(m.name)+'</span><span class="tag">'+(m.coastal||m.border?'KUST/GRÄNS':esc(m.region))+'</span></button></li>';}).join("")+"</ul>";
    pbody.innerHTML=html;
    pbody.querySelectorAll("button[data-code]").forEach(function(b){b.addEventListener("click",function(){select(b.dataset.code,true);});});
    markList();
    var set=new Set(rows.map(function(m){return m.code;}));
    municipalities.forEach(function(m){m.el.classList.toggle("dim",!set.has(m.code));});
  }
  function showDetail(m){
    pbody.innerHTML='<div class="detail"><button class="back" id="back">← Alla kommuner</button><div class="dhead"><div><h2 class="dname">'+esc(m.name)+'</h2><p class="dsub">Sveriges kommuner</p></div></div><div class="badges"><span class="region">'+esc(m.region)+'</span><span>'+esc(borderLabel(m))+'</span></div><dl class="facts"><dt>Kommunkod</dt><dd>'+esc(m.code)+'</dd><dt>Län</dt><dd>'+esc(m.lan)+'</dd><dt>Kategori</dt><dd>'+esc(m.region)+'</dd><dt>Kust / gräns</dt><dd>'+esc(borderLabel(m))+'</dd></dl><p class="note">Norr, Syd, Öst och Väst är en pedagogisk indelning efter kommunens geografiska centrum. Kust/landgräns markerar havskust samt kommuner med riksgräns mot Norge eller Finland.</p></div>';
    document.getElementById("back").onclick=function(){select(null);};
  }
  function renderMap(features){
    var parts=['<g id="sweden">'], minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
    features.forEach(function(m){
      minX=Math.min(minX,m.b[0]);minY=Math.min(minY,m.b[1]);maxX=Math.max(maxX,m.b[0]+m.b[2]);maxY=Math.max(maxY,m.b[1]+m.b[3]);
      parts.push('<path class="municipality '+regionClass(m.region)+(m.coastal?' coastal':'')+(m.border?' border':'')+'" id="m-'+esc(m.code)+'" data-code="'+esc(m.code)+'" d="'+m.d+'"><title>'+esc(m.name)+' — '+esc(m.region)+'</title></path>');
    });
    parts.push('</g>');svg.innerHTML=parts.join("");
    features.forEach(function(m){m.el=document.getElementById("m-"+m.code);byCode[m.code]=m;});
    svg.setAttribute("viewBox",[minX,minY,maxX-minX,maxY-minY].join(" "));
    fitBox([minX,minY,maxX-minX,maxY-minY],false);
  }
  function buildChips(){
    var chips=document.getElementById("chips"),items=[{v:"alla",l:"Alla"}].concat(REGION_ORDER.map(function(x){return {v:x,l:x};}),[{v:"kust",l:"Kust / landgräns"}]);
    chips.innerHTML=items.map(function(x){return '<button type="button" data-filter="'+x.v+'" aria-pressed="'+(x.v==="alla"?'true':'false')+'">'+x.l+'</button>';}).join("");
    chips.querySelectorAll("button").forEach(function(b){b.addEventListener("click",function(){filter=b.dataset.filter;chips.querySelectorAll("button").forEach(function(x){x.setAttribute("aria-pressed",x===b?'true':'false');});renderList();});});
  }
  function roll(){var pool=visible();if(pool.length>1&&selected)pool=pool.filter(function(m){return m.code!==selected.code;});if(!pool.length)return;var m=pool[Math.floor(Math.random()*pool.length)];select(m.code,true);var b=pbody.querySelector('button[data-code="'+m.code+'"]');if(b)b.scrollIntoView({block:"nearest",behavior:reduce?'auto':'smooth'});}

  svg.addEventListener("pointerover",function(e){var el=e.target.closest("path.municipality");if(!el)return;var m=byCode[el.dataset.code];if(!m)return;readout.textContent=m.name+" · "+m.region+(m.coastal||m.border?" · "+borderLabel(m):"");readout.classList.add("on");setHot(m.code);});
  svg.addEventListener("pointerleave",function(){readout.classList.remove("on");setHot(null);});
  svg.addEventListener("pointerdown",function(e){svg.setPointerCapture(e.pointerId);pointers.set(e.pointerId,[e.clientX,e.clientY]);if(pointers.size===1){dragging=true;moved=0;last=[e.clientX,e.clientY];svg.classList.add("drag");}if(pointers.size===2)pinchDistance=spread();});
  svg.addEventListener("pointermove",function(e){if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,[e.clientX,e.clientY]);var r=stage.getBoundingClientRect();if(pointers.size===2){var d=spread(),p=mid();if(pinchDistance>0&&d>0)zoomAt(p[0]-r.left,p[1]-r.top,pinchDistance/d);pinchDistance=d;moved=99;return;}if(dragging&&last){var dx=e.clientX-last[0],dy=e.clientY-last[1];moved+=Math.abs(dx)+Math.abs(dy);view.x-=dx*view.w/r.width;view.y-=dy*view.h/r.height;last=[e.clientX,e.clientY];apply();}});
  function endPointer(e){pointers.delete(e.pointerId);if(pointers.size<2)pinchDistance=0;if(pointers.size===0){dragging=false;last=null;svg.classList.remove("drag");if(moved<6){var el=document.elementFromPoint(e.clientX,e.clientY),m=el&&el.closest?el.closest("path.municipality"):null;select(m?m.dataset.code:null,false);}}}
  svg.addEventListener("pointerup",endPointer);svg.addEventListener("pointercancel",endPointer);
  function spread(){var a=Array.from(pointers.values());return Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);}
  function mid(){var a=Array.from(pointers.values());return [(a[0][0]+a[1][0])/2,(a[0][1]+a[1][1])/2];}
  svg.addEventListener("wheel",function(e){e.preventDefault();var r=stage.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,Math.exp(e.deltaY*.0016));},{passive:false});
  document.getElementById("zin").onclick=function(){var r=stage.getBoundingClientRect();zoomAt(r.width/2,r.height/2,1/1.5);};
  document.getElementById("zout").onclick=function(){var r=stage.getBoundingClientRect();zoomAt(r.width/2,r.height/2,1.5);};
  document.getElementById("zres").onclick=function(){if(homeBox)fitBox(homeBox,true);};
  queryInput.addEventListener("input",function(){query=queryInput.value;renderList();});
  document.getElementById("rndL").onclick=roll;document.getElementById("rndR").onclick=roll;
  document.getElementById("lock").onclick=function(){locked=!locked;this.classList.toggle("on",locked);this.textContent=locked?"🔒":"🔓";this.setAttribute("aria-pressed",locked?"true":"false");};
  window.addEventListener("resize",function(){if(homeBox)fitBox(homeBox,false);});

  fetch(DATA_URL).then(function(response){if(!response.ok)throw new Error("Kunde inte läsa kommungränserna ("+response.status+")");return response.json();}).then(function(data){
    municipalities=data.features.map(makeMunicipality);municipalities.forEach(function(m){byCode[m.code]=m;});
    renderMap(municipalities);buildChips();queryInput.disabled=false;document.getElementById("rndL").disabled=false;document.getElementById("rndR").disabled=false;document.getElementById("lock").disabled=false;
    countEl.textContent="290 kommuner";renderList();
  }).catch(function(error){countEl.textContent="Kunde inte ladda kartan";pbody.innerHTML='<p class="error">'+esc(error.message)+'. Kontrollera internetanslutningen och ladda om sidan.</p>';});
})();
</script>
</body>
</html>
